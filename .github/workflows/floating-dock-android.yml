name: Build Floating Dock APK

on:
  push:
    branches: [main]
    paths:
      - 'floating-dock-android/**'
      - '.github/workflows/floating-dock-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ]; then
            sdkmanager "platforms;android-35"
          fi
          if [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            sdkmanager "build-tools;35.0.0"
          fi
      - name: Assemble Debug APK
        working-directory: floating-dock-android
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: FloatingDock-debug-APK
          path: floating-dock-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
