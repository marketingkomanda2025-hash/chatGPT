b;color:white;box-shadow:0 8px 17px #81375c66;border:3px solid white;transform:translate(-50%,-50%) rotate(-45deg);z-index:2}.mapPin span{transform:rotate(45deg);font-weight:900;font-size:14px}.mapPin.selected{background:#454260;width:46px;height:46px;z-index:4}.maptop{pointer-events:none;position:absolute;top:0;left:0;right:0;padding:24px 18px 0;z-index:4;background:linear-gradient(#f7f5fb 0%,#f7f5fbdc 52%,transparent 100%)}.maptop>*{pointer-events:auto}.maptitle{font-size:22px;line-height:1.1;letter-spacing:-.05em;margin:7px 0 0}.maptop .mapsearch{background:#fffffff0;box-shadow:0 8px 27px #62526e22;margin-top:15px}.mapfilters{display:flex;gap:6px;margin:0 0 16px}.mapfilters button{background:#fffc;border:1px solid #dce7e2;color:#77738e;border-radius:12px;padding:9px 12px;font-size:11px;font-weight:700;backdrop-filter:blur(15px)}.mapfilters button.active{color:white;background:#c7469b;border-color:#c7469b}.maplabel{position:absolute;right:15px;top:195px;border-radius:13px;padding:8px 10px;color:#878097;background:#fffe;font-size:9px;font-weight:700;z-index:4}.zoomstack{position:absolute;right:16px;bottom:189px;display:flex;flex-direction:column;gap:8px;z-index:5}.zoomstack button{width:42px;height:42px;background:#fffd;border:1px solid #e5e3eb;border-radius:14px;box-shadow:0 6px 20px #56446920;font-size:23px;color:#a84286}.placeCard{position:absolute;z-index:5;bottom:176px;left:15px;right:15px;padding:17px 17px;background:#ffffff;border:1px solid #e5e2ed;border-radius:24px;box-shadow:0 14px 28px #51375c33}.placeCard.hidden{display:none}.placeCard h3{font-size:16px;margin:0 0 7px;letter-spacing:-.02em}.placeCard p{font-size:11px;color:#84859a;margin:0 0 13px}.placeCard .row button{border:0;background:#c7469b;color:white;border-radius:12px;padding:10px 13px;font-size:11px;font-weight:700}.mapview .mapnotice{position:absolute;top:189px;left:18px;padding:6px 9px;background:#fff9;border-radius:10px;font-size:9px;color:#837f98;z-index:3;pointer-events:none}.dock{position:absolute;z-index:9;bottom:calc(16px + env(safe-area-inset-bottom));left:15px;right:15px;display:flex;flex-direction:column;gap:9px;transform-origin:85% 95%;transition:opacity .31s,transform .48s cubic-bezier(.2,.85,.2,1),filter .38s;touch-action:pan-y}.glass{background:var(--glass);border:1px solid #ffffffeb;box-shadow:0 12px 38px #79477927;backdrop-filter:blur(24px) saturate(140%);-webkit-backdrop-filter:blur(24px) saturate(140%)}.talk{border-radius:23px;height:57px;display:flex;align-items:center;padding:5px 7px 5px 16px;gap:6px}.talk input{border:0;outline:0;background:transparent;min-width:0;flex:1;font-size:12px;color:var(--ink)}.talk input::placeholder{color:#87889d}.iconbutton{border:0;background:transparent;color:#807b94;width:37px;height:38px;border-radius:14px;display:grid;place-items:center}.iconbutton svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.iconbutton.submit{width:42px;height:42px;color:white;background:#c7469b;border-radius:16px}.nav{height:70px;border-radius:24px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));padding:6px;gap:2px}.nav button{border:0;background:transparent;border-radius:18px;color:#8a829b;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;min-width:0}.nav button.active{background:#f3dfef;color:#b23b8c}.nav svg{width:21px;height:21px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linecap:round;stroke-linejoin:round}.nav small{font-size:10px;font-weight:650}.mini{position:absolute;z-index:12;right:17px;bottom:calc(17px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:20px;display:grid;place-items:center;background:#c7469bf0;color:white;border:1px solid #ffffff50;box-shadow:0 11px 30px #913c7855;opacity:0;pointer-events:none;transform:translateX(30px) scale(.55) rotate(15deg);transition:transform .48s cubic-bezier(.18,1.3,.34,1),opacity .28s;touch-action:none}.mini svg{width:23px;height:23px;stroke:currentColor;stroke-width:1.8;fill:none;stroke-linejoin:round}.fold .dock{opacity:0;pointer-events:none;filter:blur(9px);transform:translateX(72px) scale(.79)}.fold .mini{opacity:1;pointer-events:auto;transform:none}.fold .placeCard{bottom:83px}.fold .zoomstack{bottom:96px}.fold .content{padding-bottom:80px}.fold .chatlog{padding-bottom:130px}.note{position:absolute;left:50%;transform:translateX(-50%);bottom:185px;z-index:20;background:#303045e9;color:white;padding:10px 15px;border-radius:13px;font-size:12px;white-space:nowrap;box-shadow:0 12px 28px #4f386a44;max-width:90%;white-space:normal;text-align:center;display:none}.empty{color:#8e849e;font-size:13px;margin:30px 0}.chatbubble{border-radius:19px 19px 5px 19px;background:#f5e4f3;padding:13px 16px;font-size:13px;line-height:1.5;margin:10px 0 10px 30px}.chathint{font-size:12px;color:#867998;padding:12px 16px;background:#fcf6fc;border-radius:17px}.chatlog{padding:0 23px 210px}.screenheading{padding:25px 23px 6px}.msg{width:100%;margin:10px 0;background:white;border-radius:16px;padding:13px 15px;color:#77778f;font-size:12px}.floatingCount{font-size:10px;background:#f8e5f4;padding:5px 8px;border-radius:10px;color:#b94996}.measure{display:flex;justify-content:space-between;margin:12px 0 2px;font-size:12px;color:#7e7991}.tabHint{font-size:11px;color:#8e8a9d;margin:2px 0 16px}

:root{--accent:#c7469b;--mint:#f5e5f3;--line:#e4e5f0;--ink:#283048;--muted:#7b8198;--glass:rgba(255,255,255,.82)}

</style></head><body><main id="app"><div class="screen" id="screen"></div><div class="dock" id="dock"><form class="talk glass" id="talk"><input id="talkinput" placeholder="Спросите или продиктуйте…" aria-label="Сообщение" autocomplete="off"><button class="iconbutton" id="mic" type="button" title="Голосовой ввод"><svg viewBox="0 0 24 24"><rect x="9" y="2.5" width="6" height="12" rx="3"/><path d="M5 10.5a7 7 0 0 0 14 0M12 17.5V22M8.5 22h7"/></svg></button><button type="submit" class="iconbutton submit" title="Отправить"><svg viewBox="0 0 24 24"><path d="m4 12 16-8-4 16-4.3-6.2L4 12Zm7.7 1.8L20 4"/></svg></button></form><div class="nav glass" id="nav"></div></div><button class="mini" id="mini" title="Развернуть интерфейс"><svg viewBox="0 0 24 24"><path d="M15.5 5.5 8.5 12l7 6.5M9 5.5 2 12l7 6.5"/></svg></button><div class="note" id="note"></div></main>
<script>
(()=>{'use strict';
const app=document.getElementById('app'),screen=document.getElementById('screen'),dock=document.getElementById('dock'),nav=document.getElementById('nav'),mini=document.getElementById('mini'),note=document.getElementById('note'),talk=document.getElementById('talk'),input=document.getElementById('talkinput');
const icons={home:'<path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V10ZM9 21v-8h6v8"/>',map:'<path d="m3 6 6-3 6 3 6-3v15l-6 3-6-3-6 3V6Zm6-3v15M15 6v15"/>',labs:'<path d="M9 3v7L4 19a2 2 0 0 0 2 3h12a2 2 0 0 0 2-3l-5-9V3M7 3h10M7 15h10"/>',profile:'<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',chart:'<path d="M4 19V5M4 19h17M8 15l4-5 4 2 4-7"/>',arrow:'<path d="M5 12h14m-6-6 6 6-6 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',pin:'<path d="M19 10c0 5-7 11-7 11S5 15 5 10a7 7 0 1 1 14 0Z"/><circle cx="12" cy="10" r="2.5"/>',doc:'<path d="M6 3h9l4 4v14H6zM15 3v5h4M9 13h7M9 17h7"/>'};
const svg=(name)=>`<svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icons[name]}</svg>`;
const navItems=[['home','Главная'],['map','Карта'],['labs','Анализы'],['profile','Кабинет']];let active='home',catFilter='Все',catSearch='',cart=0,mapFilter='Все',selected=null,mapZoom=.85,mapX=-210,mapY=-120,dragStart=null,toastTimeout,messages=[];
const analyses=[['Клинический анализ крови','1 день',509,'Кровь'],['Глюкоза в крови','1 день',null,'Кровь'],['Ферритин','1–2 дня',null,'Кровь'],['Тиреотропный гормон (ТТГ)','1 день',null,'Гормоны'],['Липидный профиль','1–2 дня',null,'Комплексы'],['Клинический анализ крови без лейкоформулы','1 день',401,'Кровь']];
const offices=[{id:1,name:'Тестовый офис № 1',sub:'Центральный район · демонстрационный адрес',x:310,y:490},{id:2,name:'Тестовый офис № 2',sub:'Северный район · демонстрационный адрес',x:560,y:440},{id:3,name:'Тестовый офис № 3',sub:'Восточный район · демонстрационный адрес',x:635,y:730},{id:4,name:'Тестовый офис № 4',sub:'Южный район · демонстрационный адрес',x:390,y:870},{id:5,name:'Тестовый офис № 5',sub:'Западный район · демонстрационный адрес',x:265,y:650}];
function toast(msg){note.textContent=msg;note.style.display='block';clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>note.style.display='none',2600)}
function setFold(v){app.classList.toggle('fold',v);document.activeElement?.blur?.()};function switchTo(page){active=page;selected=null;render();screen.scrollTop=0}
function navbar(){nav.innerHTML=navItems.map(([k,n])=>`<button type="button" data-go="${k}" class="${active===k?'active':''}" title="${n}">${svg(k)}<small>${n}</small></button>`).join('');nav.querySelectorAll('button').forEach(el=>el.onclick=()=>switchTo(el.dataset.go))}
function home(){return `<div class="content"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб <span style="font-size:9px;color:#9290a6;letter-spacing:.04em">/ FOCUS</span></div><button class="aux" data-action="focus">⤢ &nbsp; Без панелей</button></div><section class="hero"><small>НОВЫЙ ПОДХОД К СЕРВИСУ</small><h1>Ваше здоровье.<br>Ваш фокус.</h1><p>Каждая задача открывается в своём пространстве.</p><button data-go="map">Посмотреть карту →</button></section><div class="sectionHead"><h3>Что вы хотите сделать?</h3><span class="smalltag">4 сценария</span></div><div class="twoCards"><button class="jump" data-go="labs"><span class="glyph">${svg('labs')}</span><b>Сдать анализы</b><small>Поиск и заказ исследований</small></button><button class="jump" data-go="map"><span class="glyph">${svg('map')}</span><b>Найти офис</b><small>Карта на весь экран</small></button><button class="jump" data-go="results"><span class="glyph">${svg('chart')}</span><b>Мои результаты</b><small>Динамика без отвлечений</small></button><button class="jump" data-go="profile"><span class="glyph">${svg('profile')}</span><b>Личный кабинет</b><small>Заказы и сертификаты</small></button></div><div class="sectionHead"><h3>Принцип интерфейса</h3></div><div class="wideCard"><div><strong style="font-size:14px">Полноэкранная задача</strong><p>Переключайте разделы. Свайпните вправо по нижним панелям, чтобы свернуть их.</p></div><span style="font-size:31px;color:#bd559e">↗</span></div><div class="hint">Концептуальный прототип. Содержание разделов и адреса — демонстрационные. Это не действующая система Цифролаба.</div></div>`}
function labScreen(){let results=analyses.filter(a=>(catFilter==='Все'||a[3]===catFilter)&&a[0].toLowerCase().includes(catSearch.toLowerCase()));return `<div class="content"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб</div><button class="aux" data-action="focus">⤢ Фокус</button></div><h1 class="pageTitle">Каталог анализов.</h1><p class="intro">Один экран для поиска и выбора. Без главной страницы за спиной.</p><div class="search">${svg('search')}<input id="labSearch" value="${escapeHtml(catSearch)}" placeholder="Название исследования" autocomplete="off" aria-label="Поиск анализов"/></div><div class="chips">${['Все','Кровь','Гормоны','Комплексы'].map(k=>`<button class="chip ${catFilter===k?'active':''}" data-cat="${k}">${k}</button>`).join('')}</div><div class="sectionHead"><h3>Исследования</h3><span class="floatingCount">В заказе: ${cart}</span></div><div id="labResults">${renderLabs(results)}</div><div class="hint">Цены показаны только там, где есть проверенный пример в открытом каталоге. Сбор заказа — демонстрационный.</div></div>`}
function renderLabs(a){return a.length?a.map(([name,days,price])=>`<div class="labItem"><span class="labicon">${svg('labs')}</span><div style="min-width:0;flex:1"><strong>${name}</strong><div class="secondary">Результат: ${days} · демонстрация</div></div><div style="text-align:right"><div class="price">${price?price+' ₽':'Цена —'}</div><button class="add" title="Добавить в заказ" data-add="1">+</button></div></div>`).join(''):'<div class="empty">По такому запросу ничего не найдено.</div>'}
function resultsScreen(){const metrics=[['Гемоглобин','142','г/л',63],['Глюкоза','4,9','ммоль/л',42],['Общий холестерин','5,1','ммоль/л',58]];return `<div class="content"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб</div><button class="aux" data-action="focus">⤢ Фокус</button></div><div class="eyebrow" style="margin-top:40px">ИСТОРИЯ НАБЛЮДЕНИЯ</div><h1 class="pageTitle">Результаты<br>и динамика.</h1><p class="intro">Вся площадь экрана — для осмысления показателей. Ничего не отвлекает от графиков.</p><span class="badge">◈ Демонстрационные показатели</span><div style="margin-top:20px">${metrics.map(([name,val,unit,percent])=>`<div class="resultCard"><div class="row"><strong style="font-size:14px">${name}</strong><small>Демо</small></div><div class="resultBig">${val} <small>${unit}</small></div><div class="measure"><span>Пример визуализации измерения</span><span>●</span></div><div class="track"><div style="width:${percent}%"></div></div></div>`).join('')}</div><div class="hint">Эти показатели вымышлены. Данные не связаны с медицинской картой и не являются медицинской рекомендацией.</div></div>`}
function profile(){return `<div class="content"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб</div><button class="aux" data-action="focus">⤢ Фокус</button></div><h1 class="pageTitle" style="margin-top:40px">Личный кабинет.</h1><p class="intro">В одном месте — личные действия и история сервиса.</p><div class="profileCard" style="margin-top:30px"><div class="profilePic">◈</div><div><strong>Гостевой режим</strong><div style="font-size:12px;color:#89869e;margin-top:5px">Демонстрация без входа</div></div></div><div class="sectionHead"><h3>Разделы</h3></div>${[['Мои результаты','results'],['История заказов','orders'],['Сертификаты','certs'],['Найти медицинский офис','map'],['Настройки','settings']].map(([name,go])=>`<button class="linkrow" style="background:transparent;border-top:0;border-left:0;border-right:0;width:100%;text-align:left;color:inherit" data-go="${go}"><span>${name}</span><span style="color:#918ca1">→</span></button>`).join('')}<div class="hint">Авторизация, заказы и сертификаты в макете не подключены.</div></div>`}
function simplePage(page){let txt={orders:['Мои заказы','Будущая история покупок, оплат и статусов заказов.'],certs:['Сертификаты','Самостоятельное пространство для просмотра и активации сертификатов.'],settings:['Настройки','Управление профилем, приватностью и уведомлениями.']}[page];return `<div class="content"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб</div><button class="aux" data-go="profile">← Назад</button></div><h1 class="pageTitle" style="margin-top:50px">${txt[0]}</h1><p class="intro">${txt[1]}</p><div class="hint">Здесь будет полноэкранный сценарий. Сейчас это заглушка для проверки навигации.</div></div>`}
const mapSvg=`<svg viewBox="0 0 900 1450" xmlns="http://www.w3.org/2000/svg"><rect width="900" height="1450" fill="#eef0e8"/><g fill="#dce9d7"><path d="M0 65h295v225H0z"/><path d="M600 50h300v180H660z"/><path d="M580 660h320v270H580z"/><path d="M20 820h250v280H20z"/><path d="M235 430h150v115H235z"/></g><g fill="#dde8d4" stroke="#c6dbcf" stroke-width="3"><path d="M0 820h230v160H0z"/><path d="M650 280h170v120H650z"/></g><path d="M-90 660C150 520 245 555 360 622S630 748 990 555" fill="none" stroke="#a8d7db" stroke-width="86"/><path d="M-90 660C150 520 245 555 360 622S630 748 990 555" fill="none" stroke="#cbe9e7" stroke-width="63"/><g stroke="#e0ded1" stroke-width="30" fill="none"><path d="M0 160 900 720M55 0l580 1100M710 0 140 1100M0 950 900 320M0 380 900 410"/></g><g stroke="white" stroke-width="25" fill="none"><path d="M0 160 900 720M55 0l580 1100M710 0 140 1100M0 950 900 320M0 380 900 410"/></g><g stroke="#e0ded1" stroke-width="12" fill="none"><path d="M10 60 880 1090M0 260 900 80M0 785 900 940M230 0 840 1100M0 1060 900 870M0 475 900 105M480 0 530 1100M0 1040 890 210"/></g><g stroke="#fffef9" stroke-width="9" fill="none"><path d="M10 60 880 1090M0 260 900 80M0 785 900 940M230 0 840 1100M0 1060 900 870M0 475 900 105M480 0 530 1100M0 1040 890 210"/></g><g fill="#abbeb2" font-family="Arial,sans-serif" font-size="18"><text x="112" y="130">Северный парк</text><text x="630" y="145">Ботанический сад</text><text x="180" y="440" transform="rotate(-27 180 440)">улица Лесная</text><text x="535" y="940">Южный район</text><text x="80" y="890">Сквер</text><text x="445" y="215" transform="rotate(54 445 215)">Центральная улица</text><text x="680" y="490">Набережная</text><text x="60" y="350">Западный район</text></g><g fill="#b8d7c5"><circle cx="510" cy="180" r="9"/><circle cx="145" cy="835" r="12"/><circle cx="750" cy="800" r="10"/></g></svg>`;
function mapScreen(){return `<div class="mapview" id="mapview"><div class="mapworld" id="mapworld">${mapSvg}${offices.map(o=>`<button class="mapPin ${selected===o.id?'selected':''}" style="left:${o.x}px;top:${o.y}px" data-pin="${o.id}" title="${o.name}"><span>✚</span></button>`).join('')}</div><div class="mapnotice">Схематическая карта · не реальные адреса</div></div><div class="maptop"><div class="row"><div><div class="eyebrow">ПОЛНОЭКРАННЫЙ РЕЖИМ</div><h2 class="maptitle">Карта офисов</h2></div><button class="aux" data-action="focus">⤢ Фокус</button></div><div class="search mapsearch">${svg('search')}<input id="mapSearch" placeholder="Поиск офиса (демо)" aria-label="Поиск офисов" autocomplete="off"/></div><div class="mapfilters"><button class="${mapFilter==='Все'?'active':''}" data-mapfilter="Все">Все офисы</button><button class="${mapFilter==='Поблизости'?'active':''}" data-mapfilter="Поблизости">Пример рядом</button></div></div><div class="maplabel">МОСКВА · ДЕМО</div><div class="zoomstack"><button data-zoom="in" title="Приблизить">+</button><button data-zoom="out" title="Отдалить">−</button></div><div id="placehost">${placeCard()}</div>`}
function placeCard(){if(!selected)return '';const o=offices.find(v=>v.id===selected);return `<div class="placeCard"><div class="row" style="align-items:flex-start"><h3>${o.name}</h3><button style="border:0;background:transparent;color:#7e9891;font-size:20px;line-height:1" data-action="closeplace">×</button></div><p>${o.sub}</p><div class="row"><span class="badge">● Только макет</span><button data-action="chooseplace">Выбрать офис →</button></div></div>`}
function chatPage(){return `<div class="screenheading"><div class="topline"><div class="logo"><span class="logomark">✳</span> Цифролаб</div><button class="aux" data-action="focus">⤢ Фокус</button></div><h1 class="pageTitle" style="margin-top:40px">Диалог.</h1><p class="intro">Единая коммуникация из любого раздела. Сейчас это тестовый чат без AI.</p></div><div class="chatlog"><div class="chathint">Чат открыт из плавающей строки. Ниже отображаются отправленные сообщения.</div>${messages.map(m=>`<div class="chatbubble">${escapeHtml(m)}</div>`).join('')}</div>`}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){navbar();screen.innerHTML=active==='home'?home():active==='map'?mapScreen():active==='labs'?labScreen():active==='results'?resultsScreen():active==='profile'?profile():active==='chat'?chatPage():simplePage(active);bind();}
function bind(){screen.querySelectorAll('[data-go]').forEach(e=>e.onclick=()=>switchTo(e.dataset.go));screen.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{let a=e.dataset.action;if(a==='focus')setFold(!app.classList.contains('fold'));if(a==='closeplace'){selected=null;updatePlace()}if(a==='chooseplace')toast('Офис выбран (демо). Бронирование не подключено.')});if(active==='labs'){let s=screen.querySelector('#labSearch');s.oninput=()=>{catSearch=s.value;updateCatalog()};screen.querySelectorAll('[data-cat]').forEach(e=>e.onclick=()=>{catFilter=e.dataset.cat;screen.querySelectorAll('[data-cat]').forEach(x=>x.classList.toggle('active',x.dataset.cat===catFilter));updateCatalog()});}if(active==='map'){setupMap();screen.querySelectorAll('[data-zoom]').forEach(e=>e.onclick=()=>zoom(e.dataset.zoom==='in'?1.23:.81));screen.querySelectorAll('[data-mapfilter]').forEach(e=>e.onclick=()=>{mapFilter=e.dataset.mapfilter;screen.querySelectorAll('[data-mapfilter]').forEach(b=>b.classList.toggle('active',b.dataset.mapfilter===mapFilter));screen.querySelectorAll('.mapPin').forEach((p,i)=>p.style.display=mapFilter==='Все'||i<2?'':'none');selected=null;updatePlace()});screen.querySelector('#mapSearch').oninput=e=>{const q=e.target.value.trim().toLowerCase();screen.querySelectorAll('.mapPin').forEach((p,i)=>p.style.display=offices[i].name.toLowerCase().includes(q)?'':'none')}}}
function updateCatalog(){const a=analyses.filter(k=>(catFilter==='Все'||k[3]===catFilter)&&k[0].toLowerCase().includes(catSearch.toLowerCase()));screen.querySelector('#labResults').innerHTML=renderLabs(a)}function onAdd(e){if(!e.target.closest('[data-add]'))return;cart++;screen.querySelector('.floatingCount').textContent='В заказе: '+cart;toast('Добавлено в демонстрационный заказ · '+cart)}
function updateMap(){let world=screen.querySelector('#mapworld');if(world)world.style.transform=`translate(${mapX}px,${mapY}px) scale(${mapZoom})`}
function updatePlace(){let host=screen.querySelector('#placehost');if(host)host.innerHTML=placeCard();screen.querySelectorAll('.mapPin').forEach(p=>p.classList.toggle('selected',Number(p.dataset.pin)===selected));host?.querySelectorAll('[data-action]').forEach(e=>e.onclick=()=>{if(e.dataset.action==='closeplace'){selected=null;updatePlace()}else toast('Выбран тестовый офис — реального бронирования нет')})}
function zoom(factor){mapZoom=Math.max(.45,Math.min(1.8,mapZoom*factor));updateMap()}
function setupMap(){updateMap();const mv=screen.querySelector('#mapview');mv.addEventListener('pointerdown',e=>{if(e.target.closest('.mapPin'))return;dragStart={x:e.clientX,y:e.clientY,left:mapX,top:mapY};mv.setPointerCapture(e.pointerId)});mv.addEventListener('pointermove',e=>{if(!dragStart)return;mapX=dragStart.left+e.clientX-dragStart.x;mapY=dragStart.top+e.clientY-dragStart.y;updateMap()});const stop=()=>dragStart=null;mv.addEventListener('pointerup',stop);mv.addEventListener('pointercancel',stop);mv.addEventListener('wheel',e=>{e.preventDefault();zoom(e.deltaY<0?1.1:.9)},{passive:false});mv.querySelectorAll('[data-pin]').forEach(e=>e.onclick=()=>{selected=Number(e.dataset.pin);updatePlace()})}
function gesture(el,dir,callback){let start=null;el.addEventListener('touchstart',e=>{let t=e.changedTouches[0];start={x:t.clientX,y:t.clientY}},{passive:true});el.addEventListener('touchend',e=>{if(!start)return;let t=e.changedTouches[0],dx=t.clientX-start.x,dy=t.clientY-start.y;if(dx*dir>48&&Math.abs(dx)>Math.abs(dy)*1.25)callback();start=null},{passive:true});let mouse=null;el.addEventListener('mousedown',e=>mouse={x:e.clientX,y:e.clientY});el.addEventListener('mouseup',e=>{if(!mouse)return;let dx=e.clientX-mouse.x,dy=e.clientY-mouse.y;if(dx*dir>48&&Math.abs(dx)>Math.abs(dy)*1.25)callback();mouse=null})}
screen.addEventListener('click',onAdd);gesture(dock,1,()=>setFold(true));gesture(mini,-1,()=>setFold(false));mini.onclick=()=>setFold(false);talk.onsubmit=e=>{e.preventDefault();let text=input.value.trim();if(!text){toast('Напишите вопрос или сообщение');return}messages.push(text);input.value='';switchTo('chat');toast('Это тестовый чат. Сообщение добавлено.')};document.getElementById('mic').onclick=()=>{let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Распознавание речи недоступно в этом браузере');return}try{let r=new SR();r.lang='ru-RU';r.onresult=e=>{input.value=e.results[0][0].transcript;toast('Речь преобразована в текст')};r.onerror=()=>toast('Не удалось получить доступ к микрофону');r.start();toast('Говорите…')}catch{toast('Не удалось запустить запись')}};
render();
})();
</script></body></html>
